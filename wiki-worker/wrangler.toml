name = "nanomd-wiki"
account_id = "dd3e921a46bf2af8b740e6527c4f0a05"
main = "worker.js"
compatibility_date = "2024-09-23"

# preview URLs stay off so only the deployed site gets indexed; flip workers_dev
# to false once a custom domain is attached, otherwise the site has no route
workers_dev = false
preview_urls = false
routes = [
  { pattern = "nanomd.pardn.io", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false
